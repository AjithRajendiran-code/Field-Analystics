<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fielding Positions Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #102019;
    --panel: #182a21;
    --panel-2: #21362a;
    --field-outer: #25523b;
    --field-inner: #2f6b4d;
    --accent: #d8ab2f;
    --text: #eff5ed;
    --muted: #9caf9f;
    --border: rgba(216, 171, 47, 0.28);
    --token: #f4f7ef;
    --wk: #efba42;
    --danger: #dd6b6b;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: radial-gradient(circle at 20% 20%, #1a3427, var(--bg) 65%);
    color: var(--text);
    font-family: "IBM Plex Sans", sans-serif;
    min-height: 100vh;
    padding: 18px;
    -webkit-text-size-adjust: 100%;
  }

  .app {
    max-width: 1180px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 16px;
  }

  section {
    min-width: 0;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    height: fit-content;
  }

  .title {
    font-family: "DM Serif Display", serif;
    color: var(--accent);
    font-size: 24px;
    margin-bottom: 4px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input,
  select,
  button {
    width: 100%;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font: inherit;
    padding: 10px 12px;
    min-height: 44px;
  }

  input:focus,
  select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .form {
    display: grid;
    gap: 10px;
    margin-bottom: 14px;
  }

  .btn {
    cursor: pointer;
    font-weight: 600;
    transition: background 0.16s, border-color 0.16s;
  }

  .btn:hover {
    border-color: var(--accent);
    background: rgba(216, 171, 47, 0.14);
  }

  .btn-danger {
    border-color: rgba(221, 107, 107, 0.45);
    color: #ffc9c9;
  }

  .btn-danger:hover {
    border-color: var(--danger);
    background: rgba(221, 107, 107, 0.15);
  }

  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .players {
    margin-top: 12px;
    display: grid;
    gap: 6px;
    max-height: 320px;
    overflow: auto;
  }

  .player-item {
    border: 1px solid var(--border);
    background: var(--panel-2);
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }

  .player-item .meta {
    color: var(--muted);
    font-size: 11px;
  }

  .remove-btn {
    background: transparent;
    border: none;
    width: auto;
    color: #f2a7a7;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 0;
  }

  .field-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 700px;
  }

  .field-svg {
    width: min(90vw, 760px);
    height: min(90vw, 760px);
    max-width: 760px;
    max-height: 760px;
    touch-action: none;
  }

  .field-token {
    cursor: move;
  }

  .legend {
    margin-top: 10px;
    display: flex;
    justify-content: center;
    gap: 14px;
    color: var(--muted);
    font-size: 12px;
    flex-wrap: wrap;
    text-align: center;
  }

  @media (max-width: 980px) {
    body {
      padding: 12px;
    }

    .app {
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .panel {
      order: 2;
      padding: 14px;
    }

    section {
      order: 1;
    }

    .field-wrap {
      min-height: auto;
      padding: 10px;
    }

    .field-svg {
      width: min(94vw, 700px);
      height: min(94vw, 700px);
    }

    .players {
      max-height: 210px;
    }
  }

  @media (max-width: 640px) {
    body {
      padding: 10px;
    }

    .title {
      font-size: 22px;
    }

    .subtitle {
      font-size: 12px;
      margin-bottom: 10px;
    }

    .panel {
      border-radius: 10px;
      padding: 12px;
    }

    .row-2 {
      grid-template-columns: 1fr;
    }

    input,
    select,
    button {
      font-size: 16px;
      min-height: 48px;
      padding: 10px 12px;
    }

    .field-wrap {
      border-radius: 10px;
      padding: 8px;
    }

    .field-svg {
      width: min(96vw, 560px);
      height: min(96vw, 560px);
      max-height: 74vh;
    }

    .legend {
      font-size: 11px;
      gap: 8px;
    }

    .players {
      max-height: 180px;
    }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="title">Fielding Board</div>
    <div class="subtitle">Only player name and position. Wicket keeper is fixed.</div>

    <div class="form">
      <div>
        <label for="wkName">Wicket Keeper Name</label>
        <input id="wkName" type="text" placeholder="Enter wicket keeper name">
      </div>
      <div class="row-2">
        <div>
          <label for="strikerHand">Striker Hand</label>
          <select id="strikerHand">
            <option value="RHB">Right Hand</option>
            <option value="LHB">Left Hand</option>
          </select>
        </div>
        <div>
          <label for="nonStrikerHand">Non-Striker Hand</label>
          <select id="nonStrikerHand">
            <option value="RHB">Right Hand</option>
            <option value="LHB">Left Hand</option>
          </select>
        </div>
      </div>
      <div>
        <label for="playerName">Player Name</label>
        <input id="playerName" type="text" placeholder="Enter player name">
      </div>
      <button class="btn" id="addPlayerBtn">Add Player</button>
      <button class="btn" id="exportPngBtn">Export PNG</button>
      <button class="btn btn-danger" id="clearPlayersBtn">Clear All Players</button>
    </div>

    <div class="players" id="playersList"></div>
  </aside>

  <section>
    <div class="field-wrap">
      <svg class="field-svg" id="fieldSvg" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg" aria-label="Cricket field">
        <defs>
          <radialGradient id="fieldGradient" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#3b7f5c"/>
            <stop offset="100%" stop-color="#1d402f"/>
          </radialGradient>
        </defs>

        <circle cx="350" cy="350" r="320" fill="url(#fieldGradient)" stroke="#84a78f" stroke-opacity="0.5" stroke-width="2"/>
        <circle cx="350" cy="350" r="185" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-dasharray="8 7"/>

        <!-- Watermark -->
        <text x="175" y="350" text-anchor="middle" dominant-baseline="central" font-size="70" font-family="'DM Serif Display', serif" fill="#ffffff" fill-opacity="0.08" transform="rotate(-90 175 350)" pointer-events="none">PSCC</text>
        <text x="525" y="350" text-anchor="middle" dominant-baseline="central" font-size="70" font-family="'DM Serif Display', serif" fill="#ffffff" fill-opacity="0.08" transform="rotate(90 525 350)" pointer-events="none">PSCC</text>

        <rect x="331" y="248" width="38" height="204" rx="2" fill="#c5a26a" stroke="#8b6a37"/>
        <line x1="324" y1="285" x2="376" y2="285" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>
        <line x1="324" y1="415" x2="376" y2="415" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>

        <g id="batsmenInfo">
          <circle cx="350" cy="422" r="7" fill="#d8ab2f" stroke="#ffffff" stroke-width="1.2"/>
          <text x="350" y="440" text-anchor="middle" font-size="9" fill="#f7e8bf" id="strikerHandLabel">Striker: RHB</text>
          <circle cx="350" cy="278" r="7" fill="#dd6b6b" stroke="#ffffff" stroke-width="1.2"/>
          <text x="350" y="260" text-anchor="middle" font-size="9" fill="#ffd3d3" id="nonStrikerHandLabel">Non-Striker: RHB</text>
        </g>

        <g id="constantWK">
          <circle cx="350" cy="465" r="18" fill="var(--wk)" stroke="#ffffff" stroke-width="1.5"/>
          <text x="350" y="468" text-anchor="middle" font-size="10" font-weight="700" fill="#1a241d">WK</text>
          <text x="350" y="492" text-anchor="middle" font-size="11" fill="#f8d98f" id="wkNameLabel">Wicket Keeper</text>
          <text x="350" y="508" text-anchor="middle" font-size="10" fill="#f8d98f" fill-opacity="0.8">(Fixed)</text>
        </g>

        <g id="fieldTokens"></g>
      </svg>
    </div>
    <div class="legend">
      <span>White: Players</span>
      <span>Gold: Fixed Wicket Keeper</span>
      <span>Drag players to adjust</span>
    </div>
  </section>
</div>

<script>
  let players = [];
  const STORAGE_KEY = "fielding_board_state_v1";

  const wkNameInput = document.getElementById("wkName");
  const strikerHandSelect = document.getElementById("strikerHand");
  const nonStrikerHandSelect = document.getElementById("nonStrikerHand");
  const playerNameInput = document.getElementById("playerName");
  const addPlayerBtn = document.getElementById("addPlayerBtn");
  const exportPngBtn = document.getElementById("exportPngBtn");
  const clearPlayersBtn = document.getElementById("clearPlayersBtn");
  const playersList = document.getElementById("playersList");
  const fieldTokens = document.getElementById("fieldTokens");
  const fieldSvg = document.getElementById("fieldSvg");
  const wkNameLabel = document.getElementById("wkNameLabel");
  const strikerHandLabel = document.getElementById("strikerHandLabel");
  const nonStrikerHandLabel = document.getElementById("nonStrikerHandLabel");

  function updateWicketKeeperName() {
    const name = wkNameInput.value.trim();
    wkNameLabel.textContent = name || "Wicket Keeper";
    saveState();
  }

  function updateBatsmenHands() {
    strikerHandLabel.textContent = "Striker: " + strikerHandSelect.value;
    nonStrikerHandLabel.textContent = "Non-Striker: " + nonStrikerHandSelect.value;
    saveState();
  }

  function addPlayer() {
    const name = playerNameInput.value.trim();
    if (!name) {
      return;
    }

    players.push({
      id: Date.now() + Math.random(),
      name,
      x: 350,
      y: 190
    });

    playerNameInput.value = "";
    renderPlayers();
    saveState();
  }

  function removePlayer(id) {
    players = players.filter((player) => player.id !== id);
    renderPlayers();
    saveState();
  }

  function clearPlayers() {
    players = [];
    renderPlayers();
    saveState();
  }

  function renderPlayersList() {
    playersList.innerHTML = "";

    if (players.length === 0) {
      playersList.innerHTML = "<div class='player-item'><span>No players added yet.</span></div>";
      return;
    }

    players.forEach((player) => {
      const row = document.createElement("div");
      row.className = "player-item";
      row.innerHTML = `
        <div>
          <div>${player.name}</div>
        </div>
        <button class="remove-btn" aria-label="Remove ${player.name}">x</button>
      `;
      row.querySelector(".remove-btn").addEventListener("click", () => removePlayer(player.id));
      playersList.appendChild(row);
    });
  }

  function getInitials(name) {
    return name
      .split(" ")
      .filter(Boolean)
      .slice(0, 2)
      .map((part) => part[0])
      .join("")
      .toUpperCase();
  }

  function createDraggableToken(player) {
    const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
    group.setAttribute("class", "field-token");

    const initials = getInitials(player.name) || "P";
    const firstName = player.name.split(" ")[0];

    group.innerHTML = `
      <circle cx="${player.x}" cy="${player.y}" r="18" fill="var(--token)" stroke="#1a3024" stroke-width="1.5" />
      <text x="${player.x}" y="${player.y + 1}" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="#1a3024">${initials}</text>
      <text x="${player.x}" y="${player.y + 28}" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.92">${firstName}</text>
    `;

    let dragging = false;
    let pointerId = null;
    let offsetX = 0;
    let offsetY = 0;

    function toSvgPoint(clientX, clientY) {
      const svgRect = fieldSvg.getBoundingClientRect();
      const scaleX = 700 / svgRect.width;
      const scaleY = 700 / svgRect.height;
      return {
        x: (clientX - svgRect.left) * scaleX,
        y: (clientY - svgRect.top) * scaleY
      };
    }

    function onPointerDown(event) {
      event.preventDefault();
      dragging = true;
      pointerId = event.pointerId;

      const p = toSvgPoint(event.clientX, event.clientY);
      offsetX = player.x - p.x;
      offsetY = player.y - p.y;

      group.setPointerCapture(pointerId);
      window.addEventListener("pointermove", onPointerMove, { passive: false });
      window.addEventListener("pointerup", onPointerUp);
      window.addEventListener("pointercancel", onPointerUp);
    }

    function onPointerMove(event) {
      if (!dragging || event.pointerId !== pointerId) {
        return;
      }

      event.preventDefault();
      const p = toSvgPoint(event.clientX, event.clientY);
      const nextX = Math.round(p.x + offsetX);
      const nextY = Math.round(p.y + offsetY);
      const centerX = 350;
      const centerY = 350;
      const distance = Math.hypot(nextX - centerX, nextY - centerY);

      if (distance <= 315) {
        player.x = nextX;
        player.y = nextY;
        renderFieldTokens();
      }
    }

    function onPointerUp(event) {
      if (!dragging || event.pointerId !== pointerId) {
        return;
      }

      dragging = false;
      pointerId = null;
      window.removeEventListener("pointermove", onPointerMove);
      window.removeEventListener("pointerup", onPointerUp);
      window.removeEventListener("pointercancel", onPointerUp);
      saveState();
    }

    group.addEventListener("pointerdown", onPointerDown);

    return group;
  }

  function renderFieldTokens() {
    fieldTokens.innerHTML = "";
    players.forEach((player) => {
      fieldTokens.appendChild(createDraggableToken(player));
    });
  }

  function renderPlayers() {
    renderPlayersList();
    renderFieldTokens();
  }

  function exportPNG() {
    const serializer = new XMLSerializer();
    let svgString = serializer.serializeToString(fieldSvg);
    svgString = svgString.replace(/xmlns="[^"]*"/, 'xmlns="http://www.w3.org/2000/svg"');

    const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(svgBlob);
    const image = new Image();

    image.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = 1200;
      canvas.height = 1200;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#102019";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

      const link = document.createElement("a");
      link.download = "fielding-board.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
      URL.revokeObjectURL(url);
    };

    image.src = url;
  }

  function saveState() {
    const state = {
      wicketKeeperName: wkNameInput.value,
      strikerHand: strikerHandSelect.value,
      nonStrikerHand: nonStrikerHandSelect.value,
      players
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function loadState() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      return;
    }

    try {
      const state = JSON.parse(raw);
      wkNameInput.value = state.wicketKeeperName || "";
      strikerHandSelect.value = state.strikerHand || "RHB";
      nonStrikerHandSelect.value = state.nonStrikerHand || "RHB";
      players = Array.isArray(state.players) ? state.players : [];
    } catch (_error) {
      players = [];
    }
  }

  addPlayerBtn.addEventListener("click", addPlayer);
  exportPngBtn.addEventListener("click", exportPNG);
  clearPlayersBtn.addEventListener("click", clearPlayers);
  wkNameInput.addEventListener("input", updateWicketKeeperName);
  strikerHandSelect.addEventListener("change", updateBatsmenHands);
  nonStrikerHandSelect.addEventListener("change", updateBatsmenHands);
  playerNameInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      addPlayer();
    }
  });

  loadState();
  updateWicketKeeperName();
  updateBatsmenHands();
  renderPlayers();
</script>
</body>
</html>
